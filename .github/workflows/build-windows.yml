name: Build and test NetworkPlugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build standalone package
        shell: cmd
        run: call Build-Plugin.cmd --no-open --no-pause
      - name: Run standalone offline regression tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/NetworkPlugin.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Network plugin regression failed' }
      - name: Test monitor generation and settings UI without network traffic
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/NetworkMonitor.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Network monitor regression failed' }
      - name: Test VPN guards without system changes
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/VpnModule.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'VPN safety regression failed' }
      - name: Test packaged icon and actual WPF windows
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/NetworkIcon.Tests.ps1 -Utf8ParentInput
          if ($LASTEXITCODE -ne 0) { throw 'Network icon regression failed' }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/NetworkIcon.Tests.ps1 -VpnEnabled -Utf8ParentInput
          if ($LASTEXITCODE -ne 0) { throw 'VPN actual-window regression failed' }
      - name: Check out pinned host runtime for compatibility test
        uses: actions/checkout@v5
        with:
          repository: mishakov1c/app_shelf
          ref: c8edc77b5a9706e9b2f7a35a0c9a9deb2b4e3c46
          path: .test-host
          persist-credentials: false
      - name: Test actual installed plugin through host API
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/NetworkRuntime.Tests.ps1 -HostSourceDirectory "$env:GITHUB_WORKSPACE/.test-host"
          if ($LASTEXITCODE -ne 0) { throw 'Network runtime compatibility failed' }
      - name: Check out accepted baseline for upgrade test
        uses: actions/checkout@v5
        with:
          repository: mishakov1c/app_shelf_network
          ref: de1c7b16f20933de0ed19a2aa1c4e71d3b054d2b
          path: .test-baseline
          persist-credentials: false
      - name: Test upgrade from actual 1.0.3
        shell: powershell
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP ('NetworkBaseline-' + [guid]::NewGuid().ToString('N'))
          & ./.test-baseline/Build.ps1 -OutputDirectory $baseline
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/NetworkUpgrade.Tests.ps1 -HostSourceDirectory "$env:GITHUB_WORKSPACE/.test-host" -BaselinePackage (Join-Path $baseline 'NetworkPlugin-1.0.3.asplugin')
          if ($LASTEXITCODE -ne 0) { throw 'Network upgrade regression failed' }
      - uses: actions/upload-artifact@v6
        with:
          name: NetworkPlugin-${{ github.sha }}
          path: dist/NetworkPlugin-*.asplugin
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: windows
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message, 'release-preview: NetworkPlugin ') || startsWith(github.event.head_commit.message, 'release: NetworkPlugin ')) }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: NetworkPlugin-${{ github.sha }}
          path: release-package
      - name: Publish explicitly requested release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.event.head_commit.message }}
        run: |
          $subject = ($env:RELEASE_COMMIT -split '\r?\n')[0].Trim()
          $match = [regex]::Match($subject, '^(release-preview|release): NetworkPlugin ((?:0|[1-9]\d{0,4})\.(?:0|[1-9]\d{0,4})\.(?:0|[1-9]\d{0,4}))$')
          if (-not $match.Success) { throw 'Invalid release commit subject.' }
          $preview = $match.Groups[1].Value -ceq 'release-preview'
          $version = $match.Groups[2].Value
          $manifest = Get-Content plugin.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw 'Release and manifest version differ.' }
          $asset = Join-Path 'release-package' ('NetworkPlugin-' + $version + '.asplugin')
          if ((Get-Item -LiteralPath $asset -ErrorAction Stop).Length -le 0) { throw 'Empty package.' }
          if ($preview) {
            gh release create "v$version" "$asset" --prerelease --latest=false --target "$env:GITHUB_SHA" --title "NetworkPlugin $version (preview)" --generate-notes
          } else {
            gh release create "v$version" "$asset" --latest --target "$env:GITHUB_SHA" --title "NetworkPlugin $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'NetworkPlugin publication failed.' }
